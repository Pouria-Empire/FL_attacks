server:
  address: "0.0.0.0:8080"
  rounds: 20
  min_clients: 2

clients:
  total: 2
  batch_size: 32      # Batch size for all clients
  local_epochs: 2     # Clients train for 1 full epoch on their data
  learning_rate: 0.001

data:
  type: "sensor" #image and sensor
  path: "./data/SENSORs/full_processed_dataset.csv"
  train_list: "train_val_list.txt"
  test_list: "test_list.txt"

attacks:
  gradient_inversion:
    enable: false
    target_client: 1
    type: "dlg"   # <-- mdlg, dlg, ggl,gradinversion_plus,temporal (actually idlg)
    client_lr: 0.01
    # The learning rate for the attack's optimizer. Lower values (e.g., 0.01) are more stable.
    attack_lr: 0.001
    # The total number of optimization steps for the attack.
    iterations: 8000
    # The number of parallel reconstructions to run for group consistency.
    num_seeds: 32
    # The strength of the Total Variation regularization (reduces noise).
    reg_tv: 0.0001
    # The strength of the L2 norm regularization (stabilizes pixel values).
    reg_l2: 0.00001
    # The strength of the group consistency regularization (improves clarity).
    reg_group: 0.005
    # For temporal:
    history_size: 1

  model_poisoning:
    enable: true
    malicious_clients: [2] # Client 2 will be the attacker
    type: "scaling"        # Can be "scaling", "sign_flip", or "noise"
    scale_factor: -2.0     # Used only for "scaling" attack
    noise_scale: 0.5       # Used only for "noise" attack

  data_poisoning:
    enable: false
    malicious_clients: [2]
    target_label: 1        # The label to which poisoned images will be flipped
    poison_frac: 0.7       # Poison 50% of the malicious client's data
    trigger_noise_level: 0.5
    debug_malicious_client: false


mitigations:
  enable: false
  defense_type: "none" # Choose: "none", "clipping", "sparsification", "dp", "encryption", "mydefense"

  clipping_params:
    clipping_norm: 2.0
  
  sparsification_params:
    sparsity: 0.1 # Keep top 10%
  
  dp_params:
    clipping_norm: 1.5
    noise_multiplier: 0.5
  
  encryption_params:
    encryption_delay: 5.0 # Seconds to pause to simulate encryption overhead
  
  mydefense_params:
    utility_threshold: 0.1  # Allow for small, noisy decreases in accuracy
    leakage_threshold: 0.6    # If SSIM-based MyFunc score > 0.6, trigger encryption
    alpha: 0.0
    beta: 1.0                 # Weight for image leakage (set to 1 as it's the only component)
    gamma: 0.0
    chaos_key: 3.99           # Parameter for the chaotic map